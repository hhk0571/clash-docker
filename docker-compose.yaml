services:
  clash:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: "${http_proxy:-}"
        HTTP_PROXY: "${http_proxy:-}"
        https_proxy: "${http_proxy:-}"
        HTTPS_PROXY: "${http_proxy:-}"
        ## Download base URL for geoip.metadb / geosite.dat (build time).
        ## Defaults to https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest
        ## Set to a GitHub mirror/proxy if direct downloads fail, e.g.:
        ##   GEO_DAT_URL=https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest
        GEO_DAT_URL: "${GEO_DAT_URL:-}"
    image: hhk0571/clash-for-linux:latest
    environment:
      ## Timezone setting
      TZ: Asia/Shanghai

      ## Proxy settings (optional, remove if not needed)
      # HTTP_PROXY: "${http_proxy:-}"
      # HTTPS_PROXY: "${http_proxy:-}"
      # http_proxy: "${http_proxy:-}"
      # https_proxy: "${http_proxy:-}"
      # NO_PROXY: "${no_proxy:-}"
      # no_proxy: "${no_proxy:-}"

      ## Clash subscription URL (required) — supports single or multiple entries.
      ## Recommended in `docker-compose.yml` (YAML block scalar):
      CLASH_SUBSCRIPTION_URL: |
        https://example.com/sub1
        https://example.com/sub2
      ## Note: .env files usually don't support YAML block scalars; use a
      ## comma-separated value or set a single URL in that case.
      # CLASH_SUBSCRIPTION_URL: ${CLASH_SUBSCRIPTION_URL:-}
      ## Clash API secret for external UI authentication (default is empty)
      CLASH_API_SECRET: ${CLASH_API_SECRET:-}
      ## Enable local subconverter for multi-subscription merging (default is false)
      SUBCONVERTER_ENABLED: ${SUBCONVERTER_ENABLED:-false}
      ## Update hour (0-23) for daily subscription updates (default is 3)
      CLASH_UPDATE_HOUR: ${CLASH_UPDATE_HOUR:-3}
      ## Interval (in hours) to check for configuration updates
      CLASH_UPDATE_INTERVAL: ${CLASH_UPDATE_INTERVAL:-}
      ## Disable DNS only when you really need to
      # DISABLE_CLASH_DNS: ${DISABLE_CLASH_DNS:-}

      ## Runtime fallback download base URL for geoip.metadb / geosite.dat.
      ## Only used when the files are missing inside the image (e.g. the
      ## build-time download failed). Same semantics as the build arg.
      # GEO_DAT_URL: ${GEO_DAT_URL:-}

      ## port=HTTP/HTTPS, socks-port=SOCKS5, mixed-port=HTTP+SOCKS5
      ## 三个代理端口中，大多数情况只需配置 MIXED_PORT 即可
      ## Custom ports (optional). When set, the subscription config is rewritten
      ## to use these ports, and the port mappings below follow them.
      CLASH_PORT: ${CLASH_PORT:-7890}
      CLASH_SOCKS_PORT: ${CLASH_SOCKS_PORT:-7891}
      CLASH_MIXED_PORT: ${CLASH_MIXED_PORT:-17890}
      CLASH_CONTROLLER_PORT: ${CLASH_CONTROLLER_PORT:-19090}

    ports:
      - "${CLASH_PORT:-7890}:${CLASH_PORT:-7890}"  # HTTP proxy (port)
      - "${CLASH_SOCKS_PORT:-7891}:${CLASH_SOCKS_PORT:-7891}"  # SOCKS5 proxy (socks-port)
      - "${CLASH_MIXED_PORT:-17890}:${CLASH_MIXED_PORT:-17890}"  # Mixed proxy (mixed-port, HTTP+SOCKS5)
      - "${CLASH_CONTROLLER_PORT:-9090}:9090"  # External controller / Dashboard
    volumes:
      - ./config:/app/config
    restart: unless-stopped
